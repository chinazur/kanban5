name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint and constraint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check JavaScript syntax
        run: |
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > app.js
          node --check app.js

      - name: Check project constraints
        run: |
          if grep -nE 'localStorage|sessionStorage|indexedDB|document\.cookie|alert\(|confirm\(|!important|<link|src="http' index.html; then
            echo "::error::index.html violates a project constraint (see matches above)"
            exit 1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
